<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps Selection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            margin: 0;
            box-sizing: border-box;
            background-color: #f5f5f5;
            position: relative;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #333;
        }

        .map_selector {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 15%;
            box-sizing: border-box;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .map-button {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .map-button:hover {
            background-color: #9f20c1;
        }

        .log-console {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #333;
            color: #fff;
            /*padding: 10px;*/
            height: 15%;
            overflow-y: auto;
            font-family: monospace;
            border-top: 3px solid #cf0606;
        }

        .log-entry {
            margin: 2px 0;
            padding: 2px 5px;
            border-bottom: 1px solid #444;
        }

        .editor {
            display: none;
            position: absolute;
            top: 0;
            bottom: 15%;
            width: 100%;
        }

        .editor_menu {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5%; /* Exactly 5% of window height */
            align-items: center; /* Vertically center buttons */
            padding: 0 5px; /* Small side padding */
            box-sizing: border-box; /* Include padding in width */
            gap: 5px; /* Space between buttons (modern browsers) */
        }

        .editor_menu button {
            padding: 0 10px; /* Adjust as needed */
            height: 80%; /* Fits nicely inside 5% container */
            min-width: 0; /* Prevents text overflow issues */
            white-space: nowrap; /* Prevents button text from wrapping */
            overflow: hidden; /* Hides text if too long */
            text-overflow: ellipsis; /* Adds "..." if text overflows */
        }

        .paper {
            position: absolute;
            top: 5%;
            left: 0;
            width: 100%;
            height: 95%;
        }
    </style>
</head>
<body>
<div id="map_selector" class="map_selector">
    <div class="title">MAPS:</div>
    <div class="buttons-container" id="mapsContainer">
    </div>
</div>
<div id="editor" class="editor">
    <div class="editor_menu">
        <button onclick="open_map_selection()">Map Selection</button>
        <button>Button 2</button>
        <button>Button 3</button>
        <button>Button 4</button>
        <button>Button 5</button>
    </div>
    <div id="paper" class="paper">
        <canvas id="canvas">
        </canvas>
    </div>
</div>

<div class="log-console" id="logConsole">
    <div class="log-entry">Log initialized...</div>
</div>

<script>
    let socket;
    let colors;
    let symbols;
    let ctx;
    let canvas;

    document.addEventListener('DOMContentLoaded', function() {
        logMessage("Application started");

        canvas = document.getElementById("canvas");

        // Create the canvas element
        ctx = canvas.getContext('2d');
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.display = 'block';

        // Function to resize the canvas to maximum resolution
        function resizeCanvas() {
            // Get the display size of the canvas
            const displayWidth = window.innerWidth;
            const displayHeight = window.innerHeight;

            // Get the device pixel ratio
            const pixelRatio = window.devicePixelRatio || 1;

            // Set the canvas internal size (scaled by pixel ratio)
            canvas.width = Math.round(displayWidth * pixelRatio);
            canvas.height = Math.round(displayHeight * pixelRatio * (0.85 - 0.05*0.85));

            // Scale the context to account for the pixel ratio
            ctx.scale(pixelRatio, pixelRatio);
        }

        // Initial resize
        resizeCanvas();

        // Resize when the window changes size
        window.addEventListener('resize', resizeCanvas);
        connectWebSocket();
    });

    function addMapButtons(mapPaths) {
        const container = document.getElementById('mapsContainer');

        container.innerHTML = '';

        mapPaths.forEach(mapPath => {
            const button = document.createElement('button');
            button.className = 'map-button';
            button.textContent = mapPath.split('/').pop();
            button.title = mapPath;

            button.addEventListener('click', () => ask_for_map(mapPath));

            container.appendChild(button);
        });
    }

    function connectWebSocket() {
        let server_ip = 'ws://127.0.0.1:1999';
        socket = new WebSocket(server_ip);

        socket.onopen = function(_) {
            logMessage(`Connected to server ${server_ip}`);
            ask_for_maps_path();
        };

        socket.onmessage = function(event) {
            try {
                let message_from_server = JSON.parse(event.data);
                logMessage(`Received a valid Json Message from Server. Response Type: ${message_from_server.response_type}`);
                if (message_from_server.response_type === "get_maps_path"){
                    logMessage(`From Server: ${message_from_server.paths}`);
                    addMapButtons(message_from_server.paths);
                }else if (message_from_server.response_type === "unknown_request"){
                    logMessage(`From Server: Unknown request ${message_from_server.request}!`);
                }else if (message_from_server.response_type === "error"){
                    logMessage(`From Server: Error: ${message_from_server.error}`);
                }else if (message_from_server.response_type === "map") {
                    colors = message_from_server.colors;
                    symbols = message_from_server.symbols;
                    console.log(colors);
                    console.log(symbols);
                    open_editor();
                    draw_map();
                }
            } catch (e) {
                logMessage(`Received an INVALID Json Message from Server. ${e}`);
            }
        };

        socket.onclose = function(event) {
            if (event.wasClean) {
                logMessage(`Connection closed cleanly, code=${event.code}, reason=${event.reason}\n`);
                // connectWebSocket();
            } else {
                logMessage("Connection Died!");
                // connectWebSocket();
            }
        };

        socket.onerror = function(error) {
            logMessage(`WebSocket Error: ${error.message}`);
            if (socket.readyState !== WebSocket.OPEN) {
                // connectWebSocket();
            }
        };
    }

    function ask_for_maps_path(){
        const jsonAskMaps =JSON.stringify({
            request: "get_maps_path",
            content: ""
        });

        try{
            logMessage("Asked for maps path!");
            socket.send(jsonAskMaps);
        }catch (e){
            logMessage(`${e.name} -> ${e.message}`);
        }
    }

    function ask_for_map(map_path){
        const jsonAskMap =JSON.stringify({
            request: "get_map",
            content: map_path
        });

        try{
            logMessage(`Asked for map ${map_path}`);
            socket.send(jsonAskMap);
        }catch (e){
            logMessage(`${e.name} -> ${e.message}`);
        }
    }

    function logMessage(message) {
        const logConsole = document.getElementById('logConsole');
        const logEntry = document.createElement('div');
        logEntry.className = 'log-entry';

        const now = new Date();
        const timestamp = now.toLocaleTimeString();
        logEntry.textContent = `[${timestamp}] ${message}`;

        logConsole.appendChild(logEntry);

        logConsole.scrollTop = logConsole.scrollHeight;
    }

    function open_editor(){
        let map_selector = document.getElementById("map_selector");
        let editor = document.getElementById("editor");
        map_selector.style.display = "none";
        editor.style.display = "flex"
    }

    function open_map_selection(){
        let map_selector = document.getElementById("map_selector");
        let editor = document.getElementById("editor");
        map_selector.style.display = "flex";
        editor.style.display = "none"
    }

    function draw_map(){
        let xx = 300;
        let yy = 300;
        symbols.punctual_symbols.forEach(symbol => {
            symbol.circles.forEach(circle => {
                drawCircle(xx, yy, circle.radius, circle.color);
            })
            symbol.rings.forEach(ring => {
                drawRing(xx, yy, ring.inner_radius, ring.outer_width, ring.color);
            })

            if (symbol.rings.length > 0){
                xx += 40;
            }
            if (symbol.circles.length > 0){
                xx += 40;
            }
        })
    }

    function drawCircle(x, y, radius, color_id){
        console.log(`Circle ${x} ${y} ${radius} ${color_id}`)
        let color = colors.colors[color_id];
        ctx.beginPath();
        // Outer circle
        ctx.arc(x, y, parseInt(radius/30), 0, Math.PI * 2);
        ctx.closePath();
        ctx.fillStyle = `rgb(${color.r}, ${color.g}, ${color.b})`;
        ctx.fill();
    }

    function drawRing(x, y, innerRadius, outer_width, color_id) {
        console.log(`Ring ${x} ${y} ${innerRadius} ${outer_width} ${color_id}`)
        let color = colors.colors[color_id];
        ctx.beginPath();
        // Outer circle
        ctx.arc(x, y, parseInt(innerRadius/30 + outer_width/30), 0, Math.PI * 2);
        // Inner circle
        ctx.arc(x, y, parseInt(innerRadius/30), 0, Math.PI * 2, true);
        ctx.closePath();
        ctx.fillStyle = `rgb(${color.r}, ${color.g}, ${color.b})`;
        ctx.fill();
    }

    // const exampleMaps = ["Forest", "Desert", "City", "Dungeon", "Mountain", "Beach", "Volcano", "Castle", "Cave", "Island"];
    // addMapButtons(exampleMaps);
</script>
</body>
</html>
